version: 2

project_name: aix

before:
  hooks:
    - go mod tidy

builds:
  - id: aix
    main: .
    binary: aix
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: aix
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    formats: [tar.gz]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: aix
    repository:
      owner: h4ck4life
      name: homebrew-aix
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/h4ck4life/aix-go"
    description: "CLI to switch Anthropic-compatible endpoints and tokens"
    license: "MIT"
    install: |
      bin.install "aix"
    test: |
      system "#{bin}/aix", "--version"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"

scoops:
  - name: aix
    repository:
      owner: h4ck4life
      name: scoop-bucket
      token: "{{ .Env.GITHUB_TOKEN }}"
    homepage: "https://github.com/h4ck4life/aix-go"
    description: "CLI to switch Anthropic-compatible endpoints and tokens"
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
